version: '3.8'

services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_pass
      POSTGRES_DB: news_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://news_user:news_pass@db:5432/news_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app  # для разработки с авто-перезагрузкой

  # Celery worker (для фоновой обработки, если нужно; опционально)
  worker:
    build: .
    command: celery -A tasks worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://news_user:news_pass@db:5432/news_db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./:/app

volumes:
  postgres_data: